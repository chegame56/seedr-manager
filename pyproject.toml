[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seedr-manager"
version = "0.1.0"
description = "Automate uploading torrents to Seedr, strip private tags, generate magnet links with 1400+ trackers, and download via IDM."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name="Your Name", email="you@example.com" }]
requires-python = ">=3.7"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/your-username/seedr-manager"
"Repository" = "https://github.com/your-username/seedr-manager"

[project.scripts]
seedr-manager = "seedr_manager.cli:main"

[project.dependencies]
requests = "^2.31"
seedrcc = "^0.2"
torrentool = "^1.6"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-q --disable-warnings --maxfail=1"
testpaths = ["tests"]
